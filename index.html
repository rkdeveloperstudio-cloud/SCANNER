<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RKSCAN – Auto Document Scanner</title>
  <meta name="theme-color" content="#1a1a2e" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a; color: #e0e0e0; min-height: 100vh;
      padding: 12px; padding-bottom: 40px;
    }
    h1 { font-size: 1.2rem; color: #e94560; margin-bottom: 2px; }
    .sub { font-size: 0.75rem; color: #888; margin-bottom: 12px; }
    .card {
      background: #1a1a2e; border-radius: 12px; padding: 12px;
      margin-bottom: 12px; border: 1px solid #2a2a4a;
    }
    .card h2 { font-size: 0.9rem; color: #e94560; margin-bottom: 8px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 16px; border-radius: 8px; border: none; font-size: 0.9rem;
      font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 6px;
    }
    .btn:active { opacity: 0.7; }
    .btn:disabled { opacity: 0.4; }
    .btn-primary { background: #e94560; color: #fff; }
    .btn-secondary { background: #16213e; color: #e0e0e0; border: 1px solid #2a2a4a; }
    .btn-success { background: #2ecc71; color: #fff; }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; }
    #videoPreview {
      width: 100%; border-radius: 8px; background: #000; display: block;
      margin-top: 8px; min-height: 200px;
    }
    #previewContainer { display: none; margin-top: 8px; }
    #previewContainer img {
      width: 100%; border-radius: 8px; display: block; background: #fff;
    }
    .status { font-size: 0.75rem; color: #888; margin-top: 6px; text-align: center; }
    .status.ok { color: #2ecc71; }
    .status.err { color: #e94560; }
    .hidden { display: none !important; }
    .guidance {
      text-align: center; font-size: 0.85rem; padding: 8px;
      background: #16213e; border-radius: 6px; margin-top: 6px;
    }
  </style>
</head>
<body>

<h1>📄 RKSCAN Auto Scanner</h1>
<p class="sub">Auto-detect invoice edges → Capture → PDF → Share</p>

<!-- Camera + Auto Capture -->
<div class="card">
  <h2>1. Auto Scan</h2>
  <video id="videoPreview" autoplay playsinline muted></video>
  <div id="guidanceText" class="guidance hidden"></div>
  <div id="previewContainer">
    <img id="capturedImage" alt="Captured" />
  </div>
  <div class="row" style="margin-top: 8px;">
    <button class="btn btn-primary" id="startScanBtn">📷 Start Auto Scan</button>
    <button class="btn btn-secondary" id="resetBtn" style="display:none;">🔄 Retake</button>
  </div>
</div>

<!-- Export / Share -->
<div class="card" id="exportCard" style="display: none;">
  <h2>2. Export PDF & Share</h2>
  <button class="btn btn-primary" id="generatePdfBtn">📄 Generate PDF</button>
  <button class="btn btn-success" id="sharePdfBtn" style="display:none;">📤 Share PDF</button>
  <div class="status" id="exportStatus"></div>
</div>

<div class="status" id="globalStatus">Ready.</div>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/js-document-autocapture@1.0.5/dist/js-document-autocapture.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script>
(function() {
  'use strict';

  // ---------- State ----------
  let scanner = null;
  let capturedBlob = null;
  let generatedPdfBlob = null;
  let pdfFileName = '';

  const video = document.getElementById('videoPreview');
  const previewContainer = document.getElementById('previewContainer');
  const capturedImage = document.getElementById('capturedImage');
  const guidanceText = document.getElementById('guidanceText');
  const globalStatus = document.getElementById('globalStatus');
  const exportStatus = document.getElementById('exportStatus');
  const exportCard = document.getElementById('exportCard');

  const startScanBtn = document.getElementById('startScanBtn');
  const resetBtn = document.getElementById('resetBtn');
  const generatePdfBtn = document.getElementById('generatePdfBtn');
  const sharePdfBtn = document.getElementById('sharePdfBtn');

  // Check if the auto-capture library is loaded
  const autocaptureLib = window.jsDocumentAutocapture || window.createScanner;

  // ---------- Start Auto Scan ----------
  async function startAutoScan() {
    if (!autocaptureLib) {
      globalStatus.textContent = 'Auto-capture library not loaded. Check network.';
      globalStatus.className = 'status err';
      return;
    }

    try {
      startScanBtn.disabled = true;
      globalStatus.textContent = 'Initializing scanner...';

      // If scanner already exists, stop it first
      if (scanner && scanner.stop) {
        try { scanner.stop(); } catch (e) {}
      }

      // Create scanner instance
      const createScanner = autocaptureLib.createScanner || autocaptureLib;
      scanner = createScanner({
        videoElement: video,
        autoCapture: true,
        detection: 'auto',
        quality: 'high',
        maxCaptures: 1,          // Capture only one invoice, stop automatically
        cocoSsd: true,
        mlFallback: true,
        postCaptureRefine: true,
      });

      // Listen for capture event
      scanner.on('capture', (result) => {
        console.log('Captured!', result.width, result.height);
        capturedBlob = result.blob;

        // Show captured image, hide video
        const url = URL.createObjectURL(capturedBlob);
        capturedImage.src = url;
        previewContainer.style.display = 'block';
        video.style.display = 'none';
        guidanceText.classList.add('hidden');

        // Show export area
        exportCard.style.display = 'block';
        resetBtn.style.display = 'inline-flex';
        startScanBtn.style.display = 'none';

        // Reset PDF state
        generatedPdfBlob = null;
        sharePdfBtn.style.display = 'none';
        exportStatus.textContent = 'Invoice captured. Click Generate PDF.';
        exportStatus.className = 'status ok';

        globalStatus.textContent = 'Capture complete.';
        globalStatus.className = 'status ok';
      });

      // Listen for guidance messages (move closer, hold steady, etc.)
      scanner.on('guidance', (code) => {
        const messages = {
          'DOCUMENT_NOT_FOUND': '📄 Point camera at invoice',
          'MOVE_CLOSER': '🔍 Move closer',
          'HOLD_STEADY': '✋ Hold steady...',
          'CAPTURING': '📸 Capturing...'
        };
        const msg = messages[code] || '';
        if (msg) {
          guidanceText.textContent = msg;
          guidanceText.classList.remove('hidden');
        }
      });

      // Start scanning
      await scanner.start();
      globalStatus.textContent = 'Auto scan active. Position invoice in frame.';
      globalStatus.className = 'status ok';

    } catch (err) {
      console.error(err);
      globalStatus.textContent = 'Scan error: ' + err.message;
      globalStatus.className = 'status err';
      startScanBtn.disabled = false;
    }
  }

  // ---------- Reset / Retake ----------
  function resetScanner() {
    // Stop scanner
    if (scanner && scanner.stop) {
      try { scanner.stop(); } catch (e) {}
    }

    // Clear state
    capturedBlob = null;
    generatedPdfBlob = null;
    capturedImage.src = '';
    previewContainer.style.display = 'none';
    video.style.display = 'block';
    guidanceText.classList.add('hidden');
    exportCard.style.display = 'none';
    exportStatus.textContent = '';
    exportStatus.className = 'status';
    resetBtn.style.display = 'none';
    startScanBtn.style.display = 'inline-flex';
    startScanBtn.disabled = false;
    globalStatus.textContent = 'Ready. Click Start Auto Scan.';
    globalStatus.className = 'status';

    // Re-enable camera stream (if video track still exists)
    // No need to restart here; user needs to click Start Auto Scan again
  }

  // ---------- Generate PDF ----------
  async function generatePdf() {
    if (!capturedBlob) {
      exportStatus.textContent = 'No image captured.';
      exportStatus.className = 'status err';
      return;
    }

    try {
      generatePdfBtn.disabled = true;
      exportStatus.textContent = 'Generating PDF...';

      const { jsPDF } = window.jspdf;

      // Read Blob as DataURL
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(capturedBlob);
      });

      // Get image dimensions
      const img = new Image();
      img.src = dataUrl;
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
      });

      // Create PDF, page size auto-adjusts to image aspect ratio (A4 as base)
      const pdf = new jsPDF({
        orientation: img.width > img.height ? 'landscape' : 'portrait',
        unit: 'mm',
        format: 'a4',
      });

      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();

      // Calculate image scaling to fit page while preserving aspect ratio
      const ratio = Math.min(pageWidth / img.width, pageHeight / img.height);
      const imgWidth = img.width * ratio;
      const imgHeight = img.height * ratio;
      const x = (pageWidth - imgWidth) / 2;
      const y = (pageHeight - imgHeight) / 2;

      pdf.addImage(dataUrl, 'JPEG', x, y, imgWidth, imgHeight);

      generatedPdfBlob = pdf.output('blob');
      pdfFileName = `invoice_${Date.now()}.pdf`;

      exportStatus.textContent = 'PDF generated. Click Share PDF.';
      exportStatus.className = 'status ok';

      // Show share button (check if browser supports file sharing)
      if (canSharePdf()) {
        sharePdfBtn.style.display = 'inline-flex';
      } else {
        exportStatus.textContent = 'PDF generated. Sharing not supported on this browser.';
        exportStatus.className = 'status';
      }

    } catch (err) {
      console.error(err);
      exportStatus.textContent = 'PDF error: ' + err.message;
      exportStatus.className = 'status err';
    } finally {
      generatePdfBtn.disabled = false;
    }
  }

  // ---------- Check File Share Support ----------
  function canSharePdf() {
    if (!navigator.share || !navigator.canShare) return false;
    try {
      // Use a small PDF byte sequence for detection
      const testFile = new File([new Uint8Array([37, 80, 68, 70])], 't.pdf', { type: 'application/pdf' });
      return navigator.canShare({ files: [testFile] });
    } catch (e) {
      return false;
    }
  }

  // ---------- Share PDF ----------
  async function sharePdf() {
    if (!generatedPdfBlob) return;

    try {
      const file = new File([generatedPdfBlob], pdfFileName, {
        type: 'application/pdf',
      });

      // Double check if sharing is possible
      if (!navigator.canShare({ files: [file] })) {
        exportStatus.textContent = 'This browser does not support file sharing.';
        exportStatus.className = 'status err';
        return;
      }

      await navigator.share({
        title: 'Invoice Scan',
        files: [file],
      });

      exportStatus.textContent = 'Shared successfully.';
      exportStatus.className = 'status ok';

    } catch (err) {
      // Ignore user cancellation
      if (err.name === 'AbortError') return;
      console.error(err);
      exportStatus.textContent = 'Share error: ' + err.message;
      exportStatus.className = 'status err';
    }
  }

  // ---------- Event Bindings ----------
  startScanBtn.addEventListener('click', startAutoScan);
  resetBtn.addEventListener('click', resetScanner);
  generatePdfBtn.addEventListener('click', generatePdf);
  sharePdfBtn.addEventListener('click', sharePdf);

  // Cleanup camera on page leave
  window.addEventListener('beforeunload', () => {
    if (scanner && scanner.stop) {
      try { scanner.stop(); } catch (e) {}
    }
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
    }
  });

})();
</script>
</body>
</html>
